name: Companion checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/run_labs.py --check
      - run: python -m pip install -e './full-app[all]' -c full-app/requirements.lock
      - run: python -m pip install build
      - run: python -m pytest full-app/tests -q
      - run: python -m build full-app
      - run: python scripts/smoke_wheel.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './full-app[all]' -c full-app/requirements.lock
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: bash full-app/tests/browser/run.sh "$GITHUB_WORKSPACE/test-results/browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/browser
