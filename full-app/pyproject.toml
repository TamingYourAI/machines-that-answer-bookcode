[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-voice-agents"
version = "0.3.1"
description = "The book's voice-agent framework, with an insurance Claims Line and the Appointment Line as runnable tenants."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# The core (package ova) is standard library only. Everything else is an extra.
dependencies = []

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "websockets>=12",
]
webrtc = ["aiortc>=1.9", "numpy>=1.26"]
# Local hearing and speaking with no keys. Large model downloads on first use.
local = ["faster-whisper>=1.0", "kokoro-onnx>=0.4", "numpy>=1.26"]
pdf = ["pypdf>=4"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
all = ["open-voice-agents[server,webrtc,pdf,test]"]

[project.scripts]
ova = "ova_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ova_apps" = ["*/knowledge/*.md", "*/data/*.json"]
"ova_server" = ["web/*.html", "web/*.js", "web/*.webmanifest", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
